<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Page Produit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            background: #fff;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 10px;
        }

        .product-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 10px;
        }

        .product-title {
            font-size: 2em;
            margin-top: 20px;
            color: #333;
        }

        .product-description {
            font-size: 1.1em;
            line-height: 1.6;
            color: #666;
            margin-top: 15px;
        }

        .price {
            font-size: 1.5em;
            color: #27ae60;
            margin: 20px 0;
        }

        .buy-btn {
            padding: 12px 25px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1em;
            transition: background 0.3s ease;
        }

        .buy-btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://via.placeholder.com/900x400" alt="Produit" class="product-image">
        <h1 class="product-title">Nom du Produit</h1>
        <p class="product-description">
            Ceci est une description détaillée du produit. 
        </p>
        <p class="price">149,99 fcfa</p>
        <a href="#" class="buy-btn">Acheter maintenant</a>
    </div>
</body>
</html>
